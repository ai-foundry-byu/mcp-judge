[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-judge"
version = "0.1.0"
description = "A calibrated multi-persona LLM-as-judge, usable as a library or an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JD Davenport" }]
keywords = ["llm", "evals", "llm-as-judge", "calibration", "mcp", "anthropic", "claude"]
dependencies = ["anthropic>=0.39"]

[project.optional-dependencies]
server = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
mcp-judge = "mcp_judge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_judge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
